name: Build Windows Application

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Executable & Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Install NSIS (Installer builder)
        run: choco install nsis --no-progress -y

      - name: Package Windows app
        shell: bash
        run: |
          cargo xtask package
          mkdir -p release-assets

      - name: Archive Windows portable ZIP & Installer
        shell: pwsh
        run: |
          # 1. Compress portable app
          Compress-Archive -Path "dist/*" -DestinationPath "release-assets/Serein-Windows-X64-Portable.zip"
          
          # 2. Collect setup installer if created
          $installer = Get-ChildItem -Path "dist-installer/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item -LiteralPath $installer.FullName -Destination "release-assets/Serein-Windows-X64-Setup.exe"
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Serein-Windows-x64
          path: release-assets/*
          retention-days: 14
